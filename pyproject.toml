[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses Depends()/File() in argument defaults

[tool.ruff.lint.per-file-ignores]
"app/prompts.py" = ["E501"]  # long Hebrew prompt lines
